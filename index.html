<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam & Hiona — Private Japan Tours</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --moss:         #4a5c3a;
    --matcha:       #6b7c5c;
    --matcha-light: #8fa07a;
    --cedar:        #9c7a5a;
    --paper:        #f7f4ee;
    --hero-bg:      #e8ede0;
    --muted:        #7a7268;
    --divider:      #d8d2c4;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--hero-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  /* subtle bamboo texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      105deg, transparent 0px, transparent 48px,
      rgba(107,124,92,0.045) 48px, rgba(107,124,92,0.045) 50px
    );
    pointer-events: none;
  }

  .card {
    background: var(--paper);
    border-radius: 12px;
    border: 1px solid #cdd6c0;
    padding: 52px 40px 44px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(74,92,58,0.12);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 40px; right: 40px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--matcha), transparent);
    border-radius: 3px;
  }

  .flag { font-size: 24px; letter-spacing: 6px; margin-bottom: 20px; opacity: 0.6; }

  .photo {
    width: 100px; height: 124px;
    object-fit: cover;
    border-radius: 3px;
    border: 3px solid #fff;
    box-shadow: 0 4px 20px rgba(74,92,58,0.15);
    margin: 0 auto 20px;
    display: block;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px; font-weight: 300;
    color: var(--moss); letter-spacing: 1px;
    line-height: 1.15; margin-bottom: 6px;
  }
  h1 em { font-style: italic; color: var(--matcha); }

  .tagline {
    font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 32px;
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--divider);
  }
  .divider span { font-size: 12px; color: var(--matcha-light); opacity: 0.7; }

  .btn-group { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 24px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    text-decoration: none; letter-spacing: 0.3px;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,92,58,0.15); }

  .btn-primary {
    background: var(--moss); color: #e8f0dc;
  }
  .btn-secondary {
    background: #fff; color: var(--moss);
    border: 1.5px solid #cdd6c0;
  }
  .btn-secondary:hover { border-color: var(--matcha); }

  .btn-icon { font-size: 18px; }

  .footer {
    margin-top: 28px; padding-top: 20px;
    border-top: 1px solid var(--divider);
    display: flex; justify-content: center; gap: 16px;
  }
  .social-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted); text-decoration: none;
    letter-spacing: 0.5px; transition: color 0.2s;
  }
  .social-btn:hover { color: var(--moss); }

  .handle {
    margin-top: 20px;
    font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--divider);
  }
</style>
</head>
<body>
<div class="card">
  <div class="flag">🇯🇵 🇺🇸</div>

  <img class="photo" src="photo.jpeg" alt="Cam and Hiona" onerror="this.style.display='none'">

  <h1>Cam & <em>Hiona</em></h1>
  <p class="tagline">Private Japan Tours · Tokyo & Beyond</p>

  <div class="divider"><span>✦</span></div>

  <div class="btn-group">
    <a class="btn btn-primary" href="tours.html">
      <span class="btn-icon">🗾</span>
      View Our Tours & Pricing
    </a>
    <a class="btn btn-secondary" href="calendar.html">
      <span class="btn-icon">📅</span>
      Check Availability & Book
    </a>
  </div>

  <div class="footer">
    <a class="social-btn" href="https://www.instagram.com/camandhiona" target="_blank">

    <a class="social-btn" href="mailto:hionaandcam@gmail.com">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Email Us
    </a>
  </div>

  <p class="handle">45K Instagram · 8K TikTok</p>
</div>
</body>
</html>
